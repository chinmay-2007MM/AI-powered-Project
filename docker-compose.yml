services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intelliwatch
      POSTGRES_USER: intelliwatch
      POSTGRES_PASSWORD: intelliwatch
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliwatch -d intelliwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_started }
    entrypoint: ["/bin/sh", "-ec"]
    command: ['until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do sleep 2; done; mc mb --ignore-existing local/evidence']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://intelliwatch:intelliwatch@postgres:5432/intelliwatch
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
  worker:
    build: ./ai-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://intelliwatch:intelliwatch@postgres:5432/intelliwatch
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  minio_data:
